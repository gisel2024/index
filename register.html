<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Luxury Car Rental</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <a class="logo" href="index.html">Luxury<span>Car</span>Rental</a>
    <nav>
      <a href="index.html">← Back to cars</a>
    </nav>
  </header>

  <main class="auth-wrap">
    <form id="registerForm" class="auth-box" novalidate>
      <h1>Create your account</h1>
      <p class="muted">It takes a few seconds. You can book cars after this.</p>

      <label>Full name
        <input id="name" type="text" placeholder="Your name" />
      </label>
      <label>Email
        <input id="email" type="email" placeholder="you@email.com" />
      </label>
      <label>Password
        <input id="password" type="password" placeholder="At least 6 characters" />
      </label>

      <p id="formError" class="error" hidden></p>
      <button class="btn" type="submit">Create account</button>
    </form>
  </main>

  <script src="register.js"></script>
</body>
</html>
